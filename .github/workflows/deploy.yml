name: Deploy

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  ACR_NAME: ${{ vars.ACR_NAME }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  RESOURCE_GROUP: ${{ vars.RESOURCE_GROUP }}
  TF_ENV: ${{ vars.TF_ENV || 'prod' }}
  API_BASE_URL: ${{ vars.API_BASE_URL }}

permissions:
  id-token: write
  contents: read

jobs:
  # Gate: only deploy if CI passed
  check-ci:
    name: Verify CI Passed
    runs-on: ubuntu-latest
    # H-18: a workflow_run trigger runs in the privileged default-branch context.
    # Require the upstream run to have originated from this repo (not a fork PR)
    # before granting it the Azure OIDC deploy permissions.
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_repository.full_name == github.repository) }}
    steps:
      - run: echo "CI passed, proceeding with deploy"

  # 1. Infrastructure first
  deploy-infra:
    name: Terraform Apply
    runs-on: ubuntu-latest
    needs: check-ci
    environment: production
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Login to Azure
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -var-file=environments/${{ env.TF_ENV }}.tfvars -out=tfplan
        env:
          TF_VAR_azure_ad_tenant_id: ${{ secrets.AZURE_AD_TENANT_ID }}
          TF_VAR_azure_ad_client_id: ${{ secrets.AZURE_AD_CLIENT_ID }}
          TF_VAR_db_admin_password: ${{ secrets.DB_ADMIN_PASSWORD }}

      - name: Terraform Apply
        run: terraform apply tfplan

  # 2. Backend deploy (after infra)
  build-and-deploy-backend:
    name: Build & Deploy Backend
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Login to Azure
        uses: azure/login@1384c340ab2dda50fed2bee3041d1d87018aa5e8 # v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/rmp-api:${{ github.sha }}"
          docker build -t "$IMAGE_TAG" .

      - name: Scan image for vulnerabilities
        # H-17: pin to an immutable commit SHA, not the mutable @master ref, so a
        # compromised release can't run arbitrary code with this job's OIDC creds.
        uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with:
          image-ref: "${{ env.ACR_NAME }}.azurecr.io/rmp-api:${{ github.sha }}"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"

      - name: Push image
        working-directory: backend
        run: |
          IMAGE_TAG="${{ env.ACR_NAME }}.azurecr.io/rmp-api:${{ github.sha }}"
          docker push "$IMAGE_TAG"

      - name: Capture current revision for rollback
        id: prev-revision
        run: |
          PREV=$(az containerapp revision list \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --query "[?properties.active].name | [0]" -o tsv)
          echo "name=$PREV" >> "$GITHUB_OUTPUT"
          echo "Previous active revision: $PREV"

      - name: Update Container App
        id: update
        run: |
          REV_SUFFIX="s$(date +%s)"
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/rmp-api:${{ github.sha }}" \
            --revision-suffix "$REV_SUFFIX"
          echo "revision_suffix=$REV_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Health check new revision
        id: health
        run: |
          URL="${{ env.API_BASE_URL }}/health"
          echo "Polling $URL"
          for i in $(seq 1 30); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 5 "$URL" || echo "000")
            if [ "$CODE" = "200" ]; then
              echo "Healthy after ${i} attempts"
              exit 0
            fi
            echo "attempt $i: $CODE"
            sleep 3
          done
          echo "Health check failed after 90s"
          exit 1

      - name: Rollback on failure
        if: failure() && steps.update.outcome == 'success' && steps.prev-revision.outputs.name != ''
        run: |
          echo "Rolling back to ${{ steps.prev-revision.outputs.name }}"
          az containerapp ingress traffic set \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision-weight "${{ steps.prev-revision.outputs.name }}=100"
          az containerapp revision deactivate \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --revision "${{ env.CONTAINER_APP_NAME }}--${{ steps.update.outputs.revision_suffix }}" || true

  # 3. Frontend deploy (after infra, parallel with backend)
  deploy-frontend:
    name: Deploy Frontend
    runs-on: ubuntu-latest
    needs: deploy-infra
    environment: production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and build
        working-directory: frontend
        run: |
          npm ci
          npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.API_BASE_URL }}/api/v1
          VITE_AZURE_AD_CLIENT_ID: ${{ vars.AZURE_AD_CLIENT_ID }}
          VITE_AZURE_AD_AUTHORITY: ${{ vars.AZURE_AD_AUTHORITY }}
          VITE_AZURE_AD_REDIRECT_URI: ${{ vars.FRONTEND_URL }}
          VITE_API_SCOPE: ${{ vars.API_SCOPE }}

      - name: Deploy to Static Web Apps
        uses: Azure/static-web-apps-deploy@1a947af9992250f3bc2e68ad0754c0b0c11566c9 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.SWA_DEPLOYMENT_TOKEN }}
          action: upload
          app_location: frontend
          output_location: dist
          skip_app_build: true
