# Azure Pipelines — Risk Manager Pro CI/CD
# Canonical CI/CD for this repository (Azure DevOps).
#
# CI (Backend + Frontend lint/test/build) runs automatically on every PR and on
# pushes to main. The Deploy stage is gated behind the `deployEnabled` variable so
# enabling the pipeline never auto-deploys to production — set deployEnabled=true
# (a pipeline variable, or edit below) once the team is ready to release from DevOps.
#
# ── One-time Azure DevOps setup the team must complete (portal, not YAML) ──
#   1. Pipelines → New pipeline → point at this azure-pipelines.yml.
#   2. Grant free parallelism (Project settings → Parallel jobs → request the
#      Microsoft-hosted free grant) or attach a self-hosted agent pool.
#   3. Service connection "azure-rmp-connection": an Azure Resource Manager
#      connection using Workload Identity Federation (no client secret).
#      Project settings → Service connections → New → Workload Identity federation.
#   4. Variable group "RMP variable group": resource names + non-secret config
#      (AZURE_AD_TENANT_ID, AZURE_AD_CLIENT_ID, AZURE_OPENAI_ENDPOINT,
#      AZURE_SEARCH_ENDPOINT, AZURE_SEARCH_INDEX_NAME, AZURE_STORAGE_ACCOUNT_NAME,
#      CORS_ORIGINS, API_BASE_URL, FRONTEND_URL, DATABASE_URL, SWA_DEPLOYMENT_TOKEN).
#      Store DATABASE_URL / db-admin-password in Key Vault ($(keyVaultName)); the
#      pipeline reads db-admin-password per-run via the AzureKeyVault@2 task.
#   5. (Recommended) Create an Environment with required-approver checks and switch
#      the Deploy jobs to deployment jobs targeting it for a manual release gate.

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: "RMP variable group"
  - name: pythonVersion
    value: "3.12"
  - name: nodeVersion
    value: "20.x"
  - name: azureServiceConnection
    value: "azure-rmp-connection"
  - name: resourceGroup
    value: "rg-rmp-rmp-start"
  - name: acrName
    value: "acrrmprmpstart"
  - name: containerAppName
    value: "ca-rmp-rmp-start-api"
  - name: backendImage
    value: "risk-manager-pro/api-rmp-start"
  - name: openaiAccountName
    value: "oai-rmp-rmp-start"
  - name: searchServiceName
    value: "search-rmp-rmp-start"
  - name: storageAccountName
    value: "strmprmpstartfg"
  - name: keyVaultName
    value: "kv-rmp-rmp-start-fg"
  # Select the Terraform variable file by environment. This deployment targets
  # the production Faith Group tenant, so the prod tfvars (WORM lock, GP/HA
  # Postgres) must be the ones applied — previously dev.tfvars was hardcoded,
  # so the committed prod fixes (H-9/H-12) never landed.
  - name: tfVarFile
    value: "environments/prod.tfvars"
  # Safety gate: CI always runs, but Deploy only runs when this is "true".
  # Override as a pipeline variable when the team is ready to release from DevOps.
  - name: deployEnabled
    value: "false"

stages:
  # ──────────────────────────────────────────────
  # Infrastructure — Terraform
  # ──────────────────────────────────────────────
  - stage: Infrastructure
    displayName: "Infrastructure (Terraform) — SKIPPED"
    condition: "false"  # Disabled: deploying to existing rg-rmp-rmp-start resources
    jobs:
      - job: TerraformApply
        displayName: "Terraform Plan & Apply"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          # C-3: fetch the DB admin password from Key Vault per-run instead of
          # carrying it as a long-lived secret in the variable group. The secret
          # is exposed to later steps as $(db-admin-password).
          - task: AzureKeyVault@2
            displayName: "Fetch secrets from Key Vault"
            inputs:
              azureSubscription: $(azureServiceConnection)
              KeyVaultName: $(keyVaultName)
              SecretsFilter: "db-admin-password"
              RunAsPreJob: false

          - task: TerraformInstaller@1
            displayName: "Install Terraform"
            inputs:
              terraformVersion: "latest"

          - task: TerraformTaskV4@4
            displayName: "Terraform Init"
            inputs:
              provider: "azurerm"
              command: "init"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra"
              backendServiceArm: $(azureServiceConnection)
              backendAzureRmResourceGroupName: "rmp-terraform-state"
              backendAzureRmStorageAccountName: "rmpfgllctfstate"
              backendAzureRmContainerName: "tfstate"
              backendAzureRmKey: "riskmanagerpro.terraform.tfstate"

          - task: TerraformTaskV4@4
            displayName: "Terraform Plan"
            inputs:
              provider: "azurerm"
              command: "plan"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra"
              commandOptions: >-
                -var-file=$(tfVarFile)
                -var="azure_ad_tenant_id=$(AZURE_AD_TENANT_ID)"
                -var="azure_ad_client_id=$(AZURE_AD_CLIENT_ID)"
                -var="db_admin_password=$(db-admin-password)"
              environmentServiceNameAzureRM: $(azureServiceConnection)

          - task: TerraformTaskV4@4
            displayName: "Terraform Apply"
            inputs:
              provider: "azurerm"
              command: "apply"
              workingDirectory: "$(System.DefaultWorkingDirectory)/infra"
              commandOptions: >-
                -var-file=$(tfVarFile)
                -var="azure_ad_tenant_id=$(AZURE_AD_TENANT_ID)"
                -var="azure_ad_client_id=$(AZURE_AD_CLIENT_ID)"
                -var="db_admin_password=$(db-admin-password)"
              environmentServiceNameAzureRM: $(azureServiceConnection)

  # ──────────────────────────────────────────────
  # Backend — Python FastAPI
  # ──────────────────────────────────────────────
  - stage: Backend
    displayName: "Backend CI"
    dependsOn: [] # Run in parallel with Infrastructure
    jobs:
      - job: LintAndTypeCheck
        displayName: "Lint & Type Check"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              cd backend
              pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: "Install dependencies"

          - script: |
              cd backend
              ruff check app/ tests/
            displayName: "Ruff lint"

          - script: |
              cd backend
              ruff format --check app/ tests/
            displayName: "Ruff format check"

          - script: |
              cd backend
              mypy app/
            displayName: "Mypy type check"

      - job: Test
        displayName: "Unit Tests"
        pool:
          vmImage: "ubuntu-latest"
        services:
          postgres:
            image: postgres:16
            ports:
              - 5432:5432
            env:
              POSTGRES_USER: rmp_test
              POSTGRES_PASSWORD: rmp_test_password
              POSTGRES_DB: riskmanagerpro_test
        variables:
          DATABASE_URL: "postgresql+asyncpg://rmp_test:rmp_test_password@localhost:5432/riskmanagerpro_test"
        steps:
          - task: UsePythonVersion@0
            inputs:
              versionSpec: $(pythonVersion)

          - script: |
              cd backend
              pip install --upgrade pip
              pip install -e ".[dev]"
            displayName: "Install dependencies"

          - script: |
              cd backend
              pytest tests/ \
                --tb=short \
                --cov=app \
                --cov-report=xml:coverage.xml \
                --cov-report=term-missing \
                --junitxml=test-results.xml
            displayName: "Run tests"
            env:
              DATABASE_URL: $(DATABASE_URL)

          - task: PublishTestResults@2
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "backend/test-results.xml"
              testRunTitle: "Backend Tests"

          - task: PublishCodeCoverageResults@2
            condition: succeededOrFailed()
            inputs:
              summaryFileLocation: "backend/coverage.xml"

      - job: DockerBuildAndPush
        displayName: "Docker Build & Push"
        dependsOn:
          - LintAndTypeCheck
          - Test
        condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Build & push to ACR"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az acr login --name $(acrName)
                cd backend
                docker build -t $(acrName).azurecr.io/$(backendImage):$(Build.BuildId) -t $(acrName).azurecr.io/$(backendImage):latest .
                docker push $(acrName).azurecr.io/$(backendImage):$(Build.BuildId)
                docker push $(acrName).azurecr.io/$(backendImage):latest

  # ──────────────────────────────────────────────
  # Frontend — React + TypeScript
  # ──────────────────────────────────────────────
  - stage: Frontend
    displayName: "Frontend CI"
    dependsOn: [] # Run in parallel with Backend
    jobs:
      - job: LintAndTypeCheck
        displayName: "Lint & Type Check"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              cd frontend
              npm ci
            displayName: "Install dependencies"

          - script: |
              cd frontend
              npm run lint
            displayName: "ESLint"

          - script: |
              cd frontend
              npm run type-check
            displayName: "TypeScript type check"

      - job: Build
        displayName: "Build"
        dependsOn: LintAndTypeCheck
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: NodeTool@0
            inputs:
              versionSpec: $(nodeVersion)

          - script: |
              cd frontend
              npm ci
            displayName: "Install dependencies"

          - script: |
              # M-15: do not echo Azure AD identifiers to the build log. They are
              # public client IDs today, but echoing config to stdout is the pattern
              # that silently leaks a real secret the day one is piped through here.
              cd frontend
              npm run build
            displayName: "Build production bundle"
            env:
              VITE_AZURE_AD_CLIENT_ID: $(AZURE_AD_CLIENT_ID)
              VITE_AZURE_AD_AUTHORITY: https://login.microsoftonline.com/$(AZURE_AD_TENANT_ID)
              VITE_AZURE_AD_REDIRECT_URI: $(FRONTEND_URL)
              VITE_API_BASE_URL: $(API_BASE_URL)/api/v1
              VITE_API_SCOPE: api://$(AZURE_AD_CLIENT_ID)/access_as_user

          - publish: frontend/dist
            artifact: frontend-build
            displayName: "Publish build artifact"

  # ──────────────────────────────────────────────
  # Deploy — Push to Azure
  # ──────────────────────────────────────────────
  - stage: Deploy
    displayName: "Deploy to Azure"
    dependsOn:
      - Backend
      - Frontend
    condition: and(succeeded('Backend'), succeeded('Frontend'), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['deployEnabled'], 'true'))
    jobs:
      - job: DeployBackend
        displayName: "Deploy Backend (Container App)"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - task: AzureCLI@2
            displayName: "Ensure RBAC roles for Container App identity"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                PRINCIPAL_ID=$(az containerapp show \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --query "identity.principalId" -o tsv)

                echo "Container App principal ID: $PRINCIPAL_ID"

                # Cognitive Services OpenAI User on the OpenAI account
                OPENAI_ID=$(az cognitiveservices account show \
                  --name $(openaiAccountName) \
                  --resource-group $(resourceGroup) \
                  --query "id" -o tsv)
                az role assignment create \
                  --assignee "$PRINCIPAL_ID" \
                  --role "Cognitive Services OpenAI User" \
                  --scope "$OPENAI_ID" 2>/dev/null || echo "OpenAI role already assigned"

                # M-14: Search Index Data Contributor (read+write). The document
                # processor writes to the index, so Reader is insufficient; this
                # matches the Terraform grant and removes the RBAC drift.
                SEARCH_ID=$(az search service show \
                  --name $(searchServiceName) \
                  --resource-group $(resourceGroup) \
                  --query "id" -o tsv)
                az role assignment create \
                  --assignee "$PRINCIPAL_ID" \
                  --role "Search Index Data Contributor" \
                  --scope "$SEARCH_ID" 2>/dev/null || echo "Search role already assigned"

                # Storage Blob Data Contributor on the Storage account
                STORAGE_ID=$(az storage account show \
                  --name $(storageAccountName) \
                  --resource-group $(resourceGroup) \
                  --query "id" -o tsv)
                az role assignment create \
                  --assignee "$PRINCIPAL_ID" \
                  --role "Storage Blob Data Contributor" \
                  --scope "$STORAGE_ID" 2>/dev/null || echo "Storage role already assigned"

                # M-11: do NOT force-open AI Search public network access. Terraform
                # sets public_network_access_enabled = false; the backend reaches
                # Search over the VNet service endpoint with Entra/MI RBAC. Re-opening
                # it on every deploy put the index on the public internet.

          - task: AzureCLI@2
            displayName: "Update Container App image and env vars"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                # C-1: store the connection string as a Container App secret and
                # reference it, so DATABASE_URL is not a plaintext env var
                # readable via `az containerapp show`. Self-contained — sourced
                # from the existing pipeline variable, no pre-created KV secret.
                az containerapp secret set \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --secrets "database-url=$DATABASE_URL"

                az containerapp update \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --image $(acrName).azurecr.io/$(backendImage):$(Build.BuildId) \
                  --set-env-vars \
                    DATABASE_URL=secretref:database-url \
                    AZURE_OPENAI_ENDPOINT="$AZURE_OPENAI_ENDPOINT" \
                    AZURE_SEARCH_ENDPOINT="$AZURE_SEARCH_ENDPOINT" \
                    AZURE_SEARCH_INDEX_NAME="$AZURE_SEARCH_INDEX_NAME" \
                    AZURE_STORAGE_ACCOUNT_NAME="$AZURE_STORAGE_ACCOUNT_NAME" \
                    AZURE_AD_TENANT_ID="$AZURE_AD_TENANT_ID" \
                    AZURE_AD_CLIENT_ID="$AZURE_AD_CLIENT_ID" \
                    CORS_ORIGINS="$CORS_ORIGINS" \
                    APP_ENV=production \
                    LOG_LEVEL=INFO
            env:
              DATABASE_URL: $(DATABASE_URL)
              AZURE_OPENAI_ENDPOINT: $(AZURE_OPENAI_ENDPOINT)
              AZURE_SEARCH_ENDPOINT: $(AZURE_SEARCH_ENDPOINT)
              AZURE_SEARCH_INDEX_NAME: $(AZURE_SEARCH_INDEX_NAME)
              AZURE_STORAGE_ACCOUNT_NAME: $(AZURE_STORAGE_ACCOUNT_NAME)
              AZURE_AD_TENANT_ID: $(AZURE_AD_TENANT_ID)
              AZURE_AD_CLIENT_ID: $(AZURE_AD_CLIENT_ID)
              CORS_ORIGINS: $(CORS_ORIGINS)

          - task: AzureCLI@2
            displayName: "Run database migrations"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp exec \
                  --name $(containerAppName) \
                  --resource-group $(resourceGroup) \
                  --command "python -m alembic upgrade head" || echo "Migration exec not available — run manually if needed"

      - job: DeployFrontend
        displayName: "Deploy Frontend (Static Web App)"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - download: current
            artifact: frontend-build
            displayName: "Download frontend build"

          - task: AzureCLI@2
            displayName: "Deploy to Azure Static Web App"
            inputs:
              azureSubscription: $(azureServiceConnection)
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                npm install -g @azure/static-web-apps-cli
                swa deploy $(Pipeline.Workspace)/frontend-build \
                  --deployment-token "$SWA_TOKEN" \
                  --env production
            env:
              SWA_TOKEN: $(SWA_DEPLOYMENT_TOKEN)
